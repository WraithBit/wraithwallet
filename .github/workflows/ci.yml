name: Unit Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit_test:
    name: Build and test iPhone simulator
    runs-on: macos-26

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
          fetch-depth: 0

      - name: Ensure submodules are present
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          test -d core || (echo "core/ missing after submodule update" && exit 1)

      - name: Show Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install tooling
        run: |
          brew update
          brew install just xcbeautify

      - name: Create Secrets.plist for CI
        run: |
          if [ ! -f Secrets.plist ]; then
            if [ -f Secrets.example.plist ]; then
              cp Secrets.example.plist Secrets.plist
            else
              echo "Secrets.example.plist not found; creating empty Secrets.plist for CI"
              cat > Secrets.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict></dict>
          </plist>
          EOF
            fi
          fi

      - name: Unit tests
        run: just test-all
