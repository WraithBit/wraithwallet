name: Unit Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit_test:
    name: Build and Test iPhone simulator
    runs-on: macos-26

    steps:
      - name: Select Xcode
        run: |
          xcrun simctl list devices

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We ship the xcframework binaries in-repo, so ensure LFS objects are pulled.
          lfs: true
          # Keep submodules enabled in case other parts of the repo still rely on them.
          submodules: true

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # NOTE:
      # This fork ships prebuilt GemstoneFFI.xcframework binaries already in the repo (via Git LFS),
      # so we do NOT build the Rust core or regenerate bindings in CI.
      # That means we can remove:
      # - Cargo caches
      # - sccache
      # - toolchain installs
      # - `just generate-stone`

      - name: Install just
        run: brew install just

      - name: Unit Tests
        run: just test-all
