name: Unit Tests

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit_test:
    name: Build and test iPhone simulator
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true
          fetch-depth: 0

      - name: Ensure submodules are initialised
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Show Xcode and simulators
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install tooling
        shell: bash
        run: |
          set -euo pipefail
          brew install just xcbeautify

      - name: Create CI stub plists
        shell: bash
        run: |
          set -euo pipefail

          # Secrets.plist
          if [ ! -f "Secrets.plist" ]; then
            if [ -f "Secrets.example.plist" ]; then
              cp "Secrets.example.plist" "Secrets.plist"
            else
              /usr/libexec/PlistBuddy -c "Clear dict" "Secrets.plist" || true
              /usr/libexec/PlistBuddy -c "Add :IS_CI_STUB bool true" "Secrets.plist"
            fi
          fi

          # GoogleService-Info.plist (Firebase) - CI stub only
          if [ ! -f "GoogleService-Info.plist" ]; then
            /usr/libexec/PlistBuddy -c "Clear dict" "GoogleService-Info.plist" || true
            /usr/libexec/PlistBuddy -c "Add :IS_CI_STUB bool true" "GoogleService-Info.plist"
          fi

          echo "=== CI stub plists present ==="
          ls -la Secrets.plist GoogleService-Info.plist
          /usr/libexec/PlistBuddy -c "Print" Secrets.plist || true
          /usr/libexec/PlistBuddy -c "Print" GoogleService-Info.plist || true

      - name: Build Core
        shell: bash
        run: |
          set -euo pipefail
          just install-toolchains
          just generate-stone

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          just test-all
