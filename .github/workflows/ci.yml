name: Unit Tests

"on":
  workflow_dispatch: {}
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit_test:
    name: Build and test iPhone simulator
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true
          fetch-depth: 0

      - name: Ensure submodules are initialised
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Show Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install tooling
        run: brew install just xcbeautify

      - name: Create CI stub plists
        run: |
          if [ ! -f "Secrets.plist" ]; then
            if [ -f "Secrets.example.plist" ]; then
              cp Secrets.example.plist Secrets.plist
            else
              cat > Secrets.plist <<PLIST
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
</dict>
</plist>
PLIST
            fi
          fi

          if [ ! -f "GoogleService-Info.plist" ]; then
            cat > GoogleService-Info.plist <<PLIST
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>IS_CI_STUB</key>
  <true/>
</dict>
</plist>
PLIST
          fi

          ls -la Secrets.plist GoogleService-Info.plist

      - name: Build Core
        run: |
          just install-toolchains
          just generate-stone

      - name: Unit tests
        run: just test-all
