name: Unit Tests

"on":
  workflow_dispatch: {}
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit_test:
    name: Build and test iPhone simulator
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true
          fetch-depth: 0

      - name: Ensure submodules are initialised
        shell: bash
        run: |
          set -e
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Show Xcode and simulators
        shell: bash
        run: |
          set -e
          xcodebuild -version
          xcrun simctl list devices

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install tooling
        shell: bash
        run: |
          set -e
          brew install just xcbeautify

      - name: Create non-secret plists required for CI build
        shell: bash
        run: |
          set -e

          if [ ! -f "Secrets.plist" ]; then
            if [ -f "Secrets.example.plist" ]; then
              cp "Secrets.example.plist" "Secrets.plist"
            else
              cat > "Secrets.plist" <<'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
</dict>
</plist>
EOF
            fi
          fi

          if [ ! -f "GoogleService-Info.plist" ]; then
            cat > "GoogleService-Info.plist" <<'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>IS_CI_STUB</key>
  <true/>
</dict>
</plist>
EOF
          fi

          echo "=== CI stubs present ==="
          ls -la Secrets.plist GoogleService-Info.plist

      - name: Build Core
        shell: bash
        run: |
          set -e
          just install-toolchains
          just generate-stone

      - name: Unit tests
        shell: bash
        run: |
          set -e
          just test-all
